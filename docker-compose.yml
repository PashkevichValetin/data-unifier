version: '3.8'

services:
  # --- БАЗЫ ДАННЫХ ---
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432' # Внутренний и внешний порты (стандарт)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: orders_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    restart: unless-stopped

  # --- СООБЩЕНИЯ (KAFKA) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - platform-net

  kafka-broker: # Переименовал для порядка
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-broker
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ВАЖНО: Внутри сети используем порт 29092 и имя хоста kafka-broker
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-broker:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - '9092:9092'
    networks:
      - platform-net

  # --- ПРИЛОЖЕНИЕ ---
  data-unifier-service:
    build:
      context: ./data-unifier
      dockerfile: Dockerfile
    container_name: data-unifier-service
    ports:
      - "8081:8080" # Внешний 8081, внутренний 8080
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:29092
      - MYSQL_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/orders_db
      - MYSQL_DATASOURCE_USERNAME=root
      - MYSQL_DATASOURCE_PASSWORD=root
      - POSTGRES_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/users_db
      - POSTGRES_DATASOURCE_USERNAME=postgres
      - POSTGRES_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres-db:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      kafka-broker:
        condition: service_started
    networks:
      - platform-net
    restart: always

networks:
  platform-net:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
